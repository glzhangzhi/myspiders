<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载 · 视频号 / YouTube</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📥</text></svg>">
<link rel="stylesheet" href="/dashboard/theme.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }
a { color:var(--blue); text-decoration:none; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 24px; border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:20; flex-wrap:wrap; }
header h1 { font-size:19px; font-weight:600; display:flex; align-items:center; gap:8px; }
.header-right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
main.page { padding:16px 20px 60px; max-width:1200px; margin:0 auto; }

.btn { padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer;
  border:1px solid var(--border); background:transparent; color:var(--text-dim);
  transition:all .15s; white-space:nowrap; font-family:inherit; }
.btn:hover:not(:disabled) { color:var(--text); border-color:var(--text-dim); }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn-primary { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; }
.btn-primary:hover:not(:disabled) { color:var(--bg); filter:brightness(1.08); }
.btn-ghost { font-size:11px; padding:3px 9px; }
.btn-danger { color:var(--red); border-color:var(--red); }

.panel { background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; margin-bottom:12px; }
.panel h3 { font-size:12px; font-weight:600; margin-bottom:11px; display:flex;
  align-items:center; gap:7px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; }
.panel h3 .spacer { flex:1; }
.muted { color:var(--text-dim); }
.small { font-size:11px; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.err { color:var(--red); font-size:11px; }
.warn { color:var(--yellow); font-size:11px; }

input[type=text], select { background:var(--bg); border:1px solid var(--border); border-radius:6px;
  color:var(--text); padding:6px 9px; font-size:12px; font-family:inherit; }
input:focus, select:focus { outline:none; border-color:var(--accent); }

/* ── 电脑状态条 ── */
.machine { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--grey); flex:0 0 auto; display:inline-block; }
.dot.on { background:var(--green); }
.dot.warn { background:var(--yellow); }
.chk { font-size:12px; display:flex; align-items:center; gap:6px; }
.chk.off { color:var(--text-dim); }
.machine .actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

/* ── 运行进度 ── */
.run { margin-top:12px; border-top:1px dashed var(--border); padding-top:10px; display:none; }
.run.show { display:block; }
.bar { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; margin:6px 0; }
.bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .4s; }
.log { font-size:11px; line-height:1.6; max-height:180px; overflow:auto; background:var(--bg);
  border:1px solid var(--border); border-radius:6px; padding:6px 9px; white-space:pre-wrap; }

/* ── 来源 ── */
.cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
/* 来源卡固定高度：作者一多不再把下面的队列挤到很远。列表区内部滚动 */
.cols > .panel { height:460px; display:flex; flex-direction:column; }
.cols > .panel > .srclist { flex:1; min-height:0; overflow-y:auto; margin-right:-8px; padding-right:8px; }
.cols > .panel > #wx-cands { max-height:150px; overflow-y:auto; flex:0 0 auto; }
.srcfilter { width:100%; margin-bottom:8px; }
@media (max-width:860px) { .cols { grid-template-columns:1fr; } }
.addrow { display:flex; gap:6px; margin-bottom:10px; }
.addrow input { flex:1; min-width:0; }
.src { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; }
.src:last-child { border-bottom:0; }
.src img { width:30px; height:30px; border-radius:50%; object-fit:cover; background:var(--surface2); flex:0 0 auto; }
.src .ph { width:30px; height:30px; border-radius:50%; background:var(--surface2); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:14px; }
.src .body { flex:1; min-width:0; }
.src .nm { font-weight:600; word-break:break-all; }
.src .meta { color:var(--text-dim); font-size:11px; margin-top:2px; }
.src .ops { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.src.paused .nm, .src.paused .meta { opacity:.45; }
/* 多选：点行选中，Ctrl/⌘ 加减，Shift 连选（与资源管理器一致）。勾选框给触屏用 */
.src, tbody tr { cursor:default; user-select:none; }
.src { padding-left:6px; border-left:2px solid transparent; }
.src.sel, tbody tr.sel td { background:var(--accent-bg); }
.src.sel { border-left-color:var(--accent); }
.selbox { margin-top:8px; accent-color:var(--accent); cursor:pointer; flex:0 0 auto; }
td.ck { width:22px; } td.ck .selbox { margin:0; }
.bulkbar { display:none; gap:6px; align-items:center; flex-wrap:wrap; padding:6px 8px; margin-bottom:8px;
  border:1px solid var(--accent); border-radius:8px; background:var(--accent-bg); font-size:12px; }
.bulkbar.show { display:flex; }
.bulkbar .cnt { font-weight:600; color:var(--accent); margin-right:4px; }
.bulkbar .grow { flex:1; }
.hint-sel { font-size:10.5px; color:var(--text-dim); }
.cands { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.cand { display:flex; align-items:center; gap:6px; padding:4px 8px; border:1px solid var(--border);
  border-radius:16px; cursor:pointer; font-size:11.5px; background:var(--bg); }
.cand:hover { border-color:var(--accent); }
.cand img { width:18px; height:18px; border-radius:50%; }
.pill { font-size:10.5px; padding:1px 7px; border-radius:10px; border:1px solid var(--border); color:var(--text-dim); white-space:nowrap; }
.pill.acc { border-color:var(--accent); color:var(--accent); }

/* ── 队列 ── */
.tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
.tab { padding:4px 11px; border-radius:16px; font-size:12px; cursor:pointer; border:1px solid var(--border);
  color:var(--text-dim); background:transparent; font-family:inherit; }
.tab.on { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }
.tab .n { font-variant-numeric:tabular-nums; margin-left:4px; opacity:.8; }
.tabs .grow { flex:1; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { text-align:left; font-weight:600; color:var(--text-dim); font-size:11px; padding:6px 6px;
  border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:6px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
td.t { max-width:460px; word-break:break-word; }
td.t .e { color:var(--red); font-size:11px; margin-top:2px; }
td.t .f { color:var(--text-dim); font-size:11px; margin-top:2px; word-break:break-all; }
td .plat { font-size:10.5px; }
td.nowrap { white-space:nowrap; color:var(--text-dim); }
.empty { text-align:center; padding:28px 0; color:var(--text-dim); font-size:12px; }

.runs .r { display:flex; gap:10px; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--border); }
.runs .r:last-child { border-bottom:0; }
.runs .r .k { width:40px; color:var(--text-dim); }
.runs .r .s { width:60px; }
.runs .r .c { flex:1; color:var(--text-dim); }
.st-ok { color:var(--success); } .st-failed { color:var(--red); } .st-running { color:var(--accent); }
.st-stopped, .st-interrupted { color:var(--yellow); }

.toast { position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-60px);
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:9px 18px; border-radius:8px; font-size:13px; z-index:999; transition:transform .25s;
  box-shadow:0 4px 18px rgba(0,0,0,.4); }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.err { border-color:var(--red); color:var(--red); }
.toast.ok { border-color:var(--green); }
</style>
</head>
<body>
<header>
  <h1>📥 下载 <span class="muted small" style="font-weight:400">视频号作者 · YouTube 列表 → 3060ti 的 D 盘</span></h1>
  <div class="header-right">
    <button class="btn btn-ghost" onclick="loadAll(true)">刷新</button>
  </div>
</header>

<main class="page">
  <!-- 电脑状态 + 操作 -->
  <section class="panel">
    <h3>3060ti<span class="spacer"></span><span class="small muted" id="checked-at"></span></h3>
    <div class="machine">
      <span class="chk" id="m-online"><span class="dot"></span>检测中…</span>
      <span class="chk" id="m-wx"></span>
      <span class="chk" id="m-yt"></span>
      <span class="chk" id="m-disk"></span>
      <div class="actions">
        <button class="btn" id="b-scan" onclick="doScan()">检测更新</button>
        <button class="btn btn-primary" id="b-dl" onclick="doDownload()">开始下载</button>
        <button class="btn btn-danger" id="b-stop" onclick="doStop()" style="display:none">停止</button>
        <button class="btn btn-ghost" id="b-upd" onclick="doUpdate()" title="pip install -U yt-dlp">更新 yt-dlp</button>
      </div>
    </div>
    <div class="small muted" id="m-hint" style="margin-top:8px"></div>
    <div class="run" id="run">
      <div class="small"><b id="run-title"></b> <span class="muted" id="run-cur"></span></div>
      <div class="bar"><i id="run-bar"></i></div>
      <div class="log mono" id="run-log"></div>
    </div>
  </section>

  <!-- 来源 -->
  <div class="cols">
    <section class="panel">
      <h3>🎥 视频号作者<span class="spacer"></span><span class="small muted" id="wx-n"></span></h3>
      <div class="addrow">
        <input type="text" id="wx-in" placeholder="作者昵称，或 v2_…@finder" onkeydown="if(event.key==='Enter')addWx()">
        <button class="btn" onclick="addWx()">添加</button>
        <button class="btn" onclick="showFollowed()" title="列出你微信里关注的全部视频号，点一下就加">从关注里选</button>
      </div>
      <div id="wx-cands"></div>
      <input type="text" class="srcfilter" id="wx-filter" placeholder="在已添加的作者里筛选…" oninput="renderSources()">
      <div class="bulkbar" id="wx-bulk"></div>
      <div id="wx-list" class="srclist"></div>
    </section>
    <section class="panel">
      <h3>▶️ YouTube 播放列表<span class="spacer"></span><span class="small muted" id="yt-n"></span></h3>
      <div class="addrow">
        <input type="text" id="yt-in" placeholder="播放列表链接（含 list=…）" onkeydown="if(event.key==='Enter')addYt()">
        <button class="btn" onclick="addYt()">添加</button>
      </div>
      <div class="bulkbar" id="yt-bulk"></div>
      <div id="yt-list" class="srclist"></div>
    </section>
  </div>

  <!-- 队列 -->
  <section class="panel">
    <h3>队列<span class="spacer"></span><span class="hint-sel">点行选中 · Ctrl 多选 · Shift 连选 · Esc 取消</span></h3>
    <div class="tabs" id="tabs"></div>
    <div class="bulkbar" id="bulk"></div>
    <div id="items"></div>
  </section>

  <section class="panel">
    <h3>最近运行<span class="spacer"></span><button class="btn btn-ghost" id="b-clear-runs" onclick="clearRuns()" title="删除运行记录（进行中的保留）">清空</button></h3>
    <div class="runs" id="runs"></div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script src="/legacy/common.js"></script>
<script>
const API = '/api/media';
const S = { status: null, sources: [], items: [], counts: {}, tab: 'pending', filter: '', runs: [] };
const TABS = [['pending','待下载'],['downloading','下载中'],['done','已完成'],['failed','失败'],['skipped','已跳过']];
// 队列标签记在本地：刷新后回到上次看的那一栏（存的值已不在 TABS 里就回默认）
{ const t = lsGet('media.tab', ''); if (TABS.some(x => x[0] === t)) S.tab = t; }
const PLAT = { wx: '视频号', yt: 'YouTube' };

function esc(s) { return esc2(s == null ? '' : s); }
async function api(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: { 'Content-Type': 'application/json', 'x-token': getToken(), ...(opt.headers || {}) } });
  let d = null; try { d = await r.json(); } catch (_) {}
  if (!r.ok) {
    const det = d && d.detail;
    const msg = typeof det === 'string' ? det : (det && det.msg) || `HTTP ${r.status}`;
    const e = new Error(msg); e.detail = det; e.status = r.status; throw e;
  }
  return d;
}
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

function ago(t) {
  if (!t) return '从未';
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
function fmtDate(t) { if (!t) return ''; const d = new Date(t); return d.toLocaleDateString('zh-CN', { year: '2-digit', month: '2-digit', day: '2-digit' }); }
function fmtSize(b) { if (!b) return ''; const u = ['B','KB','MB','GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(i >= 2 ? 1 : 0) + u[i]; }
function fmtDur(s) { if (!s) return ''; s = Math.round(s); const m = Math.floor(s / 60), x = s % 60; return m >= 60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; }

// ── 状态 ────────────────────────────────────────────────────────────────
async function loadStatus() {
  try { S.status = await api('/status'); } catch (e) { S.status = null; showToast(e.message, 'err'); }
  renderStatus();
}
function chk(el, state, text) {
  el.className = 'chk' + (state === 'off' ? ' off' : '');
  el.innerHTML = `<span class="dot ${state === 'on' ? 'on' : state === 'warn' ? 'warn' : ''}"></span>${text}`;
}
function renderStatus() {
  const st = S.status || {}; const a = st.agent || {}; const busy = !!st.busy;
  const on = !!a.online;
  chk(document.getElementById('m-online'), on ? 'on' : 'off', on ? '在线' : '离线（关机 / 睡眠）');
  const wxEl = document.getElementById('m-wx'), ytEl = document.getElementById('m-yt'), dEl = document.getElementById('m-disk');
  if (on) {
    chk(wxEl, a.wx_available ? 'on' : 'warn', a.ltaoo ? (a.wx_available ? '视频号页面已连接' : '视频号页面未连接') : '下载器未运行');
    const ytOk = a.ytdlp && a.ffmpeg;
    // 登录状态以「最近一次真实请求的结果」为准；文件里有登录字段 ≠ 登录有效
    const cs = a.cookie_state || {};
    const loginOk = a.cookies_login && cs.ok !== false;
    const srcLabel = a.cookie_source === 'firefox' ? 'Firefox 登录' : a.cookie_source === 'file' ? 'cookies.txt' : '未登录';
    const loginTxt = !a.cookies_login ? ' · YouTube 未登录' : cs.ok === false ? ` · ${srcLabel}已失效` : ` · ${srcLabel}`;
    chk(ytEl, ytOk && loginOk ? 'on' : 'warn', `yt-dlp ${esc(a.ytdlp || '缺失')}${a.ffmpeg ? '' : ' · 缺 ffmpeg'}${loginTxt}`);
    const low = a.free_gb != null && a.free_gb < 20;
    chk(dEl, low ? 'warn' : 'on', a.free_gb != null ? `D 盘剩 ${a.free_gb} GB` : 'D 盘未知');
  } else { wxEl.innerHTML = ''; ytEl.innerHTML = ''; dEl.innerHTML = ''; }

  const hints = [];
  if (on && !a.ltaoo) hints.push('视频号要先在电脑上启动 <b>wx_video_download.exe</b>（%LOCALAPPDATA%\\wx_video_download）。');
  else if (on && !a.wx_available) hints.push('视频号：在电脑微信里<b>打开视频号</b>（任意页面），下载器才连得上。');
  if (on && a.cookie_source !== 'firefox' && (!a.cookies_login || (a.cookie_state || {}).ok === false))
    hints.push('YouTube 登录：Chrome 导出的 cookies.txt 半小时左右就会失效。一劳永逸的做法：在 3060ti 上装 <b>Firefox</b>，登录一次 YouTube，之后程序直接读 Firefox 的登录状态，不用再导出（Firefox 平时不用开着）。');
  if (!on) hints.push(`电脑开着时每 ${st.scan_interval_minutes || 30} 分钟自动检测一次；下载只在点「开始下载」后进行。`);
  if (a.error) hints.push(`<span class="err">${esc(a.error)}</span>`);
  document.getElementById('m-hint').innerHTML = hints.join('<br>');

  const c = st.counts || {};
  document.getElementById('b-dl').textContent = `开始下载${c.pending ? ` (${c.pending})` : ''}`;
  document.getElementById('b-scan').disabled = !on || busy;
  document.getElementById('b-dl').disabled = !on || busy || !c.pending;
  document.getElementById('b-upd').disabled = !on || busy;
  document.getElementById('b-stop').style.display = busy || st.run ? '' : 'none';
  document.getElementById('checked-at').textContent = new Date().toLocaleTimeString('zh-CN');

  const run = st.run, box = document.getElementById('run');
  if (run) {
    box.classList.add('show');
    document.getElementById('run-title').textContent = run.kind === 'scan' ? '正在检测…' : '正在下载…';
    const cur = run.current;
    let txt = '';
    if (cur) {
      txt = `${PLAT[cur.platform] || ''} · ${(cur.title || '').slice(0, 50)}`;
      if (cur.pct != null) txt += ` · ${cur.pct}%`;
      if (cur.speed) txt += ` · ${fmtSize(cur.speed)}/s`;
      if (cur.eta) txt += ` · 剩 ${fmtDur(cur.eta)}`;
    }
    document.getElementById('run-cur').textContent = txt;
    document.getElementById('run-bar').style.width = (cur && cur.pct != null ? cur.pct : 0) + '%';
    const lg = document.getElementById('run-log');
    lg.textContent = (run.log || []).slice(-60).join('\n');
    lg.scrollTop = lg.scrollHeight;
  } else box.classList.remove('show');
  if (S._wasRunning && !run) { loadSources(); loadItems(); loadRuns(); }
  S._wasRunning = !!run;
  schedule();
}
let _timer = null;
function schedule() {
  clearTimeout(_timer);
  if (document.hidden) return;
  const fast = S.status && (S.status.busy || S.status.run);
  _timer = setTimeout(loadStatus, fast ? 2000 : 30000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadStatus(); });

// ── 多选（来源两栏 + 队列共用）────────────────────────────────────────────
// 规则照搬资源管理器：单击 = 只选这一个（再点一次取消）；Ctrl/⌘ = 加减一个；
// Shift = 从上次点的那个连到这个（同时按 Ctrl 则在现有选择上追加这一段）。
// 连选的「顺序」是当前屏幕上看得见的顺序（筛选之后的），不是数据库顺序。
const SEL = { wx: { set: new Set(), anchor: null }, yt: { set: new Set(), anchor: null }, items: { set: new Set(), anchor: null } };
function visibleIds(group) {
  if (group === 'items') return [...document.querySelectorAll('#items tbody tr[data-id]')].map(r => r.dataset.id);
  return [...document.querySelectorAll(`#${group}-list .src[data-id]`)].map(r => r.dataset.id);
}
function selPick(group, id, ev, viaBox) {
  const sel = SEL[group], ids = visibleIds(group);
  const multi = viaBox || ev.ctrlKey || ev.metaKey;
  if (ev.shiftKey && sel.anchor && ids.includes(sel.anchor)) {
    const a = ids.indexOf(sel.anchor), b = ids.indexOf(id);
    if (!multi) sel.set.clear();
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) sel.set.add(ids[i]);
  } else if (multi) {
    sel.set.has(id) ? sel.set.delete(id) : sel.set.add(id);
    sel.anchor = id;
  } else {
    const only = sel.set.size === 1 && sel.set.has(id);
    sel.set.clear(); if (!only) sel.set.add(id);
    sel.anchor = id;
  }
  paintSel(group);
}
// 点在按钮/链接/输入框/候选上不算选行
function rowClick(ev, group) {
  if (ev.target.closest('button, a, input, select, .cand')) return;
  selPick(group, ev.currentTarget.dataset.id, ev, false);
}
function boxClick(ev, group) { ev.stopPropagation(); selPick(group, ev.target.closest('[data-id]').dataset.id, ev, true); }
// Shift+点击时浏览器会顺手选中一片文字，挡掉
function noTextSel(ev) { if (ev.shiftKey) ev.preventDefault(); }
function selAll(group) { const sel = SEL[group]; visibleIds(group).forEach(id => sel.set.add(id)); paintSel(group); }
function selClear(group) { SEL[group].set.clear(); SEL[group].anchor = null; paintSel(group); }
function pruneSel(group) {   // 数据刷新后去掉已经不在屏幕上的
  const ids = new Set(visibleIds(group)); const sel = SEL[group];
  [...sel.set].forEach(id => { if (!ids.has(id)) sel.set.delete(id); });
  if (sel.anchor && !ids.has(sel.anchor)) sel.anchor = null;
}
function paintSel(group) {
  const sel = SEL[group].set;
  const rows = group === 'items' ? document.querySelectorAll('#items tbody tr[data-id]')
                                 : document.querySelectorAll(`#${group}-list .src[data-id]`);
  rows.forEach(r => { const on = sel.has(r.dataset.id); r.classList.toggle('sel', on);
    const b = r.querySelector('.selbox'); if (b) b.checked = on; });
  const all = document.getElementById(group === 'items' ? 'sel-all-items' : null);
  if (all) { const n = rows.length; all.checked = n > 0 && sel.size === n; all.indeterminate = sel.size > 0 && sel.size < n; }
  if (group === 'items') renderItemBulk(); else renderSrcBulk(group);
}
// 只有「正在打字」才让出快捷键；焦点停在勾选框上（刚点过它）不算
function typing(t) { return t.matches('textarea, select, input:not([type=checkbox]):not([type=radio]):not([type=button])'); }
document.addEventListener('keydown', e => {
  if (typing(e.target)) return;
  if (e.key === 'Escape') ['wx', 'yt', 'items'].forEach(g => SEL[g].set.size && selClear(g));
  // Ctrl+A 全选队列（来源栏用批量条上的「全选」）
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); selAll('items'); }
});

// ── 来源 ────────────────────────────────────────────────────────────────
async function loadSources() {
  try { S.sources = (await api('/sources')).items || []; } catch (e) { showToast(e.message, 'err'); }
  renderSources();
}
function srcRow(s) {
  const c = s.counts || {};
  const avatar = s.head_url ? `<img src="${escAttr(s.head_url)}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`
                            : `<div class="ph">${s.platform === 'wx' ? '🎥' : '▶️'}</div>`;
  const name = s.name || s.input || s.key;
  const stats = [c.pending && `待下 ${c.pending}`, c.done && `已下 ${c.done}`, c.failed && `失败 ${c.failed}`, c.skipped && `跳过 ${c.skipped}`].filter(Boolean).join(' · ');
  let meta = `检测：${ago(s.last_scan_at)}`;
  if (s.last_new_count) meta += ` · 上次新增 ${s.last_new_count}`;
  if (stats) meta += ` · ${stats}`;
  let extra = '';
  if (s.status === 'unresolved') extra = `<div class="warn">还没绑定到具体作者 —— 电脑在线时检测会自动按昵称匹配</div>`;
  if (s.status === 'needs_pick') {
    extra = `<div class="warn">「${esc(s.input)}」匹配到 ${(s.candidates || []).length} 个作者，点选一个：</div><div class="cands">` +
      (s.candidates || []).map(cd => `<span class="cand" onclick="pick('${escAttr(s.id)}','${escAttr(cd.username)}')">${cd.head_url ? `<img src="${escAttr(cd.head_url)}" referrerpolicy="no-referrer">` : ''}${esc(cd.nickname)}</span>`).join('') +
      '</div>';
  }
  if (s.last_scan_error && s.status !== 'needs_pick') extra += `<div class="err">${esc(s.last_scan_error)}</div>`;
  const modeTitle = s.mode === 'all' ? '列表/作者里的全部作品都下载' : '只下载添加之后发布的新作品（历史作品记为已跳过）';
  return `<div class="src ${s.status === 'paused' ? 'paused' : ''}${SEL[s.platform].set.has(s.id) ? ' sel' : ''}" data-id="${escAttr(s.id)}"
      onclick="rowClick(event,'${s.platform}')" onmousedown="noTextSel(event)">
    <input type="checkbox" class="selbox" ${SEL[s.platform].set.has(s.id) ? 'checked' : ''} onclick="boxClick(event,'${s.platform}')">
    ${avatar}
    <div class="body">
      <div class="nm">${esc(name)} ${s.status === 'paused' ? '<span class="pill">已暂停</span>' : ''}
        <span class="pill ${s.mode === 'all' ? 'acc' : ''}" title="${escAttr(modeTitle)}">${s.mode === 'all' ? '全部' : '仅新作'}</span>
        ${s.platform === 'wx' && s.mode === 'all' && s.full_done === false ? '<span class="pill" title="下次检测会把这个作者的历史作品翻到底">待补全历史</span>' : ''}</div>
      <div class="meta">${meta}</div>${extra}
    </div>
    <div class="ops">
      ${s.platform === 'wx' && (c.skipped || s.mode !== 'all') ? `<button class="btn btn-ghost" onclick="queueSkipped('${escAttr(s.id)}', ${c.skipped || 0})" title="已跳过的加入待下载，并在下次检测时把更早的作品翻出来">补下历史</button>` : ''}
      <button class="btn btn-ghost" onclick="toggleMode('${escAttr(s.id)}','${s.mode}')" title="${escAttr(modeTitle)}">切换模式</button>
      <button class="btn btn-ghost" onclick="togglePause('${escAttr(s.id)}', ${s.status === 'paused'})">${s.status === 'paused' ? '恢复' : '暂停'}</button>
      <button class="btn btn-ghost btn-danger" onclick="delSource('${escAttr(s.id)}')">删除</button>
    </div>
  </div>`;
}
function renderSources() {
  for (const p of ['wx', 'yt']) {
    const all = S.sources.filter(s => s.platform === p);
    const fEl = document.getElementById(p + '-filter');
    const q = fEl ? fEl.value.trim().toLowerCase() : '';
    const list = q ? all.filter(s => (s.name || s.input || '').toLowerCase().includes(q)) : all;
    document.getElementById(p + '-n').textContent = all.length ? (q ? `${list.length} / ${all.length} 个` : `${all.length} 个`) : '';
    document.getElementById(p + '-list').innerHTML = list.length ? list.map(srcRow).join('')
      : `<div class="empty">${p === 'wx' ? '还没有作者' : '还没有播放列表'}</div>`;
    pruneSel(p); renderSrcBulk(p);
  }
}
function renderSrcBulk(p) {
  const bar = document.getElementById(p + '-bulk'); const sel = SEL[p].set;
  if (!sel.size) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
  const chosen = S.sources.filter(s => sel.has(s.id));
  const skipped = chosen.reduce((n, s) => n + ((s.counts || {}).skipped || 0), 0);
  const anyPaused = chosen.some(s => s.status === 'paused'), anyActive = chosen.some(s => s.status !== 'paused');
  bar.innerHTML = `<span class="cnt">已选 ${sel.size}</span>
    <button class="btn btn-ghost" onclick="srcBatch('${p}','mode_all')" title="作者/列表里的全部作品都下载">设为全部</button>
    <button class="btn btn-ghost" onclick="srcBatch('${p}','mode_new')" title="只下载之后新发的">设为仅新作</button>
    ${anyActive ? `<button class="btn btn-ghost" onclick="srcBatch('${p}','pause')">暂停</button>` : ''}
    ${anyPaused ? `<button class="btn btn-ghost" onclick="srcBatch('${p}','resume')">恢复</button>` : ''}
    ${p === 'wx' ? `<button class="btn btn-ghost" onclick="srcBatch('${p}','queue_skipped')" title="已跳过的加入待下载，并在下次检测时把更早的作品翻出来">补下历史${skipped ? `（${skipped}）` : ''}</button>` : ''}
    <button class="btn btn-ghost btn-danger" onclick="srcBatch('${p}','delete')">删除</button>
    <span class="grow"></span>
    <button class="btn btn-ghost" onclick="selAll('${p}')">全选</button>
    <button class="btn btn-ghost" onclick="selClear('${p}')">取消选择</button>`;
  bar.classList.add('show');
}
async function srcBatch(p, action) {
  const ids = [...SEL[p].set]; if (!ids.length) return;
  const names = S.sources.filter(s => ids.includes(s.id)).map(s => s.name || s.input || s.id);
  const list = names.slice(0, 6).join('、') + (names.length > 6 ? ` 等 ${names.length} 个` : '');
  if (action === 'delete' && !confirm(`删除 ${list}？\n待下载/已跳过/失败的条目会一并删除；已下载的记录保留（防止以后重复下载）。`)) return;
  if (action === 'queue_skipped' && !confirm(`补下 ${list} 的历史作品？\n已跳过的立刻加入待下载；并切到「全部」，下次检测会把更早的作品也翻出来。`)) return;
  if (action === 'mode_all' && p === 'wx' && !confirm(`把 ${list} 设为「全部」？\n下次检测会把这些作者的全部历史作品翻出来并加入待下载，可能很多。`)) return;
  try {
    const r = await post('/sources/batch', { ids, action });
    const msg = { mode_all: '已设为全部', mode_new: '已设为仅新作', pause: '已暂停', resume: '已恢复',
                  delete: `已删除 ${r.n} 个`, queue_skipped: `已加入 ${r.items} 个；点「检测更新」把更早的作品也翻出来` }[action];
    showToast(msg, 'ok');
    if (action === 'delete') selClear(p);
    loadSources(); if (action === 'delete' || action === 'queue_skipped') { loadItems(); loadStatus(); }
  } catch (e) { showToast(e.message, 'err'); }
}
async function addWx() {
  const inp = document.getElementById('wx-in'); const v = inp.value.trim(); if (!v) return;
  const box = document.getElementById('wx-cands');
  const a = (S.status || {}).agent || {};
  if (/^v2_.*@finder$/i.test(v) || !a.online || !a.wx_available) {
    // 离线也能加：先存成「未绑定」，下次检测时按昵称自动匹配
    try { await post('/sources', { platform: 'wx', input: v }); inp.value = ''; box.innerHTML = '';
      showToast(a.online && a.wx_available ? '已添加' : '已添加（电脑在线时自动匹配作者）', 'ok'); loadSources(); }
    catch (e) { showToast(e.message, 'err'); }
    return;
  }
  await searchWx(v);
}
async function showFollowed() {
  const a = (S.status || {}).agent || {};
  if (!a.online || !a.wx_available) { showToast('视频号页面未连接：先在电脑微信里打开视频号', 'err'); return; }
  await searchWx('');
}
async function searchWx(v) {
  const box = document.getElementById('wx-cands');
  box.innerHTML = `<div class="small muted">${v ? '搜索中…' : '读取你关注的作者…'}</div>`;
  try {
    const r = await api('/wx/search?keyword=' + encodeURIComponent(v));
    if (r.error) { box.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
    const added = new Set(S.sources.filter(s => s.platform === 'wx').map(s => s.key));
    const cs = (r.candidates || []).filter(c => !added.has(c.username));
    const note = r.note ? `<div class="small muted">${esc(r.note)}</div>` : '';
    if (!cs.length) {
      box.innerHTML = note + `<div class="warn">${v ? '没找到这个作者。先在微信里关注 TA，再点「从关注里选」。' : '关注的作者都已经添加过了'}</div>`;
      return;
    }
    S._cands = cs;
    box.innerHTML = note + `<div class="small muted">点一下就添加（${cs.length} 个）：<a href="#" onclick="document.getElementById('wx-cands').innerHTML='';return false">收起</a></div><div class="cands" style="margin-bottom:10px">` +
      cs.map((c, i) => `<span class="cand" onclick="addPicked(${i})" title="${escAttr(c.signature || '')}">${c.head_url ? `<img src="${escAttr(c.head_url)}" referrerpolicy="no-referrer">` : ''}${esc(c.nickname)}</span>`).join('') + '</div>';
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function addPicked(i) {
  const c = S._cands[i];
  try { await post('/sources', { platform: 'wx', input: c.nickname, pick: c });
    document.getElementById('wx-in').value = '';
    // 从关注列表里连续点选时保持列表打开，只把加过的那个去掉
    S._cands.splice(i, 1);
    const box = document.getElementById('wx-cands');
    const chip = box.querySelectorAll('.cand')[i]; if (chip) chip.remove();
    box.querySelectorAll('.cand').forEach((el, j) => el.setAttribute('onclick', `addPicked(${j})`));
    showToast(`已添加 ${c.nickname}`, 'ok'); loadSources(); }
  catch (e) { showToast(e.message, 'err'); }
}
async function addYt() {
  const inp = document.getElementById('yt-in'); const v = inp.value.trim(); if (!v) return;
  try { await post('/sources', { platform: 'yt', input: v }); inp.value = ''; showToast('已添加，点「检测更新」读取列表', 'ok'); loadSources(); }
  catch (e) { showToast(e.message, 'err'); }
}
async function pick(sid, username) {
  try { await api('/sources/' + encodeURIComponent(sid), { method: 'PATCH', body: JSON.stringify({ pick_username: username }) });
    showToast('已绑定，下次检测生效', 'ok'); loadSources(); } catch (e) { showToast(e.message, 'err'); }
}
async function toggleMode(sid, mode) {
  try { await api('/sources/' + encodeURIComponent(sid), { method: 'PATCH', body: JSON.stringify({ mode: mode === 'all' ? 'new_only' : 'all' }) });
    loadSources(); } catch (e) { showToast(e.message, 'err'); }
}
async function togglePause(sid, paused) {
  try { await api('/sources/' + encodeURIComponent(sid), { method: 'PATCH', body: JSON.stringify({ paused: !paused }) });
    loadSources(); } catch (e) { showToast(e.message, 'err'); }
}
async function delSource(sid) {
  const src = S.sources.find(x => x.id === sid) || {};
  const name = src.name || src.input || sid;
  if (!confirm(`删除「${name}」？\n待下载/已跳过/失败的条目会一并删除；已下载的记录保留（防止以后重复下载）。`)) return;
  try { await api('/sources/' + encodeURIComponent(sid), { method: 'DELETE' }); loadSources(); loadItems(); }
  catch (e) { showToast(e.message, 'err'); }
}
async function queueSkipped(sid, n) {
  if (!confirm(`补下这个作者的历史作品？\n${n ? `${n} 个已跳过的立刻加入待下载；` : ''}下次检测会把更早的作品也翻出来加入待下载。`)) return;
  try { const r = await post('/sources/' + encodeURIComponent(sid) + '/queue-skipped'); showToast(`已加入 ${r.n} 个；点「检测更新」把更早的作品也翻出来`, 'ok'); loadSources(); loadItems(); loadStatus(); }
  catch (e) { showToast(e.message, 'err'); }
}

// ── 队列 ────────────────────────────────────────────────────────────────
async function loadItems() {
  try { const r = await api(`/items?status=${S.tab}&limit=500`); S.items = r.items || []; S.counts = r.counts || {}; }
  catch (e) { showToast(e.message, 'err'); }
  renderItems();
}
function setTab(t) { if (t !== S.tab) selClear('items'); S.tab = t; lsSet('media.tab', t); loadItems(); }
function renderItems() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) =>
    `<button class="tab ${S.tab === k ? 'on' : ''}" onclick="setTab('${k}')">${l}<span class="n">${S.counts[k] || 0}</span></button>`).join('') +
    `<span class="grow"></span><input type="text" placeholder="筛选标题/作者" value="${escAttr(S.filter)}" oninput="S.filter=this.value;renderItems()" style="width:180px">`;
  const q = S.filter.trim().toLowerCase();
  const rows = S.items.filter(it => !q || (it.title || '').toLowerCase().includes(q) || (it.author || '').toLowerCase().includes(q) || (it.source_name || '').toLowerCase().includes(q));
  if (!rows.length) { document.getElementById('items').innerHTML = `<div class="empty">${S.tab === 'pending' ? '没有待下载的。点「检测更新」看看有没有新东西。' : '空'}</div>`; pruneSel('items'); renderItemBulk(); return; }
  const op = it => {
    const id = escAttr(it.id);
    if (it.status === 'pending') return `<button class="btn btn-ghost" onclick="dlOne('${id}')" title="只下载这一个">下载</button> <button class="btn btn-ghost" onclick="skip('${id}')">跳过</button>`;
    if (it.status === 'failed') return `<button class="btn btn-ghost" onclick="requeue('${id}')">重试</button> <button class="btn btn-ghost" onclick="skip('${id}')">跳过</button>`;
    if (it.status === 'skipped') return `<button class="btn btn-ghost" onclick="requeue('${id}')">加入队列</button>`;
    if (it.status === 'done') return `<button class="btn btn-ghost" onclick="requeue('${id}', true)" title="文件丢了/想重下">重下</button>`;
    return '';
  };
  const timeCol = S.tab === 'done' ? '完成' : '发现';
  const sel = SEL.items.set;
  document.getElementById('items').innerHTML = `<table><thead><tr><th class="ck"><input type="checkbox" class="selbox" id="sel-all-items" title="全选 / 全不选" onclick="event.target.checked ? selAll('items') : selClear('items')"></th><th></th><th>标题</th><th>来源</th><th>发布</th><th>时长</th><th>${timeCol}</th><th></th></tr></thead><tbody>` +
    rows.map(it => `<tr data-id="${escAttr(it.id)}" class="${sel.has(it.id) ? 'sel' : ''}" onclick="rowClick(event,'items')" onmousedown="noTextSel(event)">
      <td class="ck"><input type="checkbox" class="selbox" ${sel.has(it.id) ? 'checked' : ''} onclick="boxClick(event,'items')"></td>
      <td class="plat"><span class="pill">${PLAT[it.platform] || it.platform}</span></td>
      <td class="t">${it.url ? `<a href="${escAttr(it.url)}" target="_blank" rel="noopener">${esc(it.title || '(无标题)')}</a>` : esc(it.title || '(无标题)')}
        ${it.error ? `<div class="e">${esc(it.error)}</div>` : ''}
        ${it.file_path ? `<div class="f mono">${esc(it.file_path)}${it.file_size ? ' · ' + fmtSize(it.file_size) : ''}</div>` : ''}</td>
      <td class="nowrap">${esc(it.source_name || it.author || '')}</td>
      <td class="nowrap">${fmtDate(it.published_at)}</td>
      <td class="nowrap">${fmtDur(it.duration)}</td>
      <td class="nowrap">${ago(S.tab === 'done' ? it.done_at : it.discovered_at)}</td>
      <td class="nowrap">${op(it)}</td></tr>`).join('') + '</tbody></table>';
  pruneSel('items'); paintSel('items');
}
function renderItemBulk() {
  const bar = document.getElementById('bulk'); const n = SEL.items.set.size;
  const parts = [];
  if (n) {
    parts.push(`<span class="cnt">已选 ${n}</span>`);
    if (S.tab === 'pending') parts.push(`<button class="btn btn-ghost" onclick="itemBatch('download')">下载所选</button>`, `<button class="btn btn-ghost" onclick="itemBatch('skip')">跳过所选</button>`);
    if (S.tab === 'failed') parts.push(`<button class="btn btn-ghost" onclick="itemBatch('requeue')">重试所选</button>`, `<button class="btn btn-ghost" onclick="itemBatch('skip')">跳过所选</button>`);
    if (S.tab === 'skipped') parts.push(`<button class="btn btn-ghost" onclick="itemBatch('requeue')">加入队列</button>`);
    if (S.tab === 'done') parts.push(`<button class="btn btn-ghost" onclick="itemBatch('redo')">重下所选</button>`);
    parts.push('<span class="grow"></span>', `<button class="btn btn-ghost" onclick="selClear('items')">取消选择</button>`);
  } else {
    if (S.tab === 'failed' && (S.counts.failed || 0)) parts.push(`<button class="btn btn-ghost" onclick="requeueFailed()">全部重试</button>`);
    if ((S.tab === 'pending' || S.tab === 'failed') && (S.counts[S.tab] || 0)) {
      const q = S.filter.trim();
      parts.push('<span class="grow"></span>', `<button class="btn btn-ghost" onclick="clearTab()" title="移到「已跳过」，不删除；在那里可以加回队列">${q ? '清空筛选出的' : '清空'}${TABS.find(t => t[0] === S.tab)[1]}</button>`);
    }
  }
  bar.innerHTML = parts.join(' ');
  bar.classList.toggle('show', parts.length > 0);
}
async function itemBatch(action) {
  const ids = [...SEL.items.set]; if (!ids.length) return;
  try {
    if (action === 'download') { await startDownload(ids); selClear('items'); return; }
    if (action === 'redo' && !confirm(`重新下载这 ${ids.length} 个？（YouTube 会先查 .archive.txt，若要强制重下需删掉对应行）`)) return;
    if (action === 'redo' || (action === 'requeue' && S.tab === 'failed')) {
      await retryNow(ids, action === 'redo' ? '重下' : '重试'); selClear('items'); return;
    }
    const r = await post(action === 'skip' ? '/items/skip' : '/items/requeue', { ids });
    showToast(`${action === 'skip' ? '已跳过' : '已加入待下载'} ${r.n} 个`, 'ok');
    selClear('items'); loadItems(); loadStatus(); loadSources();
  } catch (e) { showToast(e.message, 'err'); }
}
async function skip(id) { try { await post('/items/skip', { ids: [id] }); loadItems(); loadStatus(); } catch (e) { showToast(e.message, 'err'); } }
// 「重试 / 重下」= 放回待下载 **并立刻开始下载这几个**。
// 只放回去不下载的话，它们会淹没在上千条待下载里，看起来就像「点了重试条目消失了」（2026-11-02 实际发生）。
async function retryNow(ids, label) {
  const r = await post('/items/requeue', { ids });
  const st = S.status || {}, a = st.agent || {};
  if (!a.online) { showToast(`${label} ${r.n} 个已放回待下载；3060ti 离线，开机后点「开始下载」`, 'ok'); }
  else if (st.busy || st.run) { showToast(`${label} ${r.n} 个已放回待下载；当前有任务在跑，结束后点「开始下载」`, 'ok'); }
  else { await startDownload(ids); }
  loadItems(); loadStatus(); loadSources();
}
async function requeue(id, confirmDone) {
  if (confirmDone && !confirm('重新下载这一个？（YouTube 会先查 .archive.txt，若要强制重下需删掉那一行）')) return;
  try { await retryNow([id], confirmDone ? '重下' : '重试'); } catch (e) { showToast(e.message, 'err'); }
}
async function requeueFailed() {
  const ids = S.tab === 'failed' ? S.items.map(it => it.id) : [];
  try {
    if (ids.length) await retryNow(ids, '重试');
    else { const r = await post('/items/requeue-failed'); showToast(`${r.n} 个重新加入待下载`, 'ok'); loadItems(); loadStatus(); }
  } catch (e) { showToast(e.message, 'err'); }
}
async function dlOne(id) { await startDownload([id]); }
// 清空 = 移到「已跳过」：删掉的话下次检测会把它们重新插入成待下载（见 repo.skip_all）。
// 有筛选词时只清筛选出来的那些，所见即所清。
async function clearTab() {
  const name = TABS.find(t => t[0] === S.tab)[1];
  const q = S.filter.trim().toLowerCase();
  const vis = q ? S.items.filter(it => (it.title || '').toLowerCase().includes(q) || (it.author || '').toLowerCase().includes(q) || (it.source_name || '').toLowerCase().includes(q)) : null;
  const n = vis ? vis.length : (S.counts[S.tab] || 0);
  if (!n) return;
  if (!confirm(`把${vis ? '筛选出的' : '全部'} ${n} 个「${name}」移到「已跳过」？\n不会删除，之后可以在「已跳过」里加回队列。`)) return;
  try {
    const r = vis ? await post('/items/skip', { ids: vis.map(it => it.id) }) : await post('/items/clear', { status: S.tab });
    showToast(`已移到「已跳过」${r.n} 个`, 'ok'); selClear('items'); loadItems(); loadStatus(); loadSources();
  } catch (e) { showToast(e.message, 'err'); }
}
async function clearRuns() {
  if (!S.runs.length) return;
  if (!confirm('清空运行记录？（进行中的保留）')) return;
  try { const r = await api('/runs', { method: 'DELETE' }); showToast(`已删除 ${r.n} 条`, 'ok'); loadRuns(); }
  catch (e) { showToast(e.message, 'err'); }
}

// ── 运行 ────────────────────────────────────────────────────────────────
function errMsg(e) { return e.detail && e.detail.offline ? '3060ti 离线：开机后再试' : e.message; }
async function doScan() {
  try { await post('/scan', {}); showToast('开始检测', 'ok'); S._wasRunning = true; setTimeout(loadStatus, 800); }
  catch (e) { showToast(errMsg(e), 'err'); }
}
async function doDownload() { await startDownload(null); }
async function startDownload(ids) {
  try { await post('/download', { ids: ids || [] }); showToast('开始下载', 'ok'); S._wasRunning = true; setTimeout(() => { loadStatus(); loadItems(); }, 800); }
  catch (e) { showToast(errMsg(e), 'err'); }
}
async function doStop() {
  if (!confirm('停止当前任务？没下完的会退回「待下载」。')) return;
  try { await post('/stop'); showToast('已发送停止', 'ok'); setTimeout(loadStatus, 1500); } catch (e) { showToast(e.message, 'err'); }
}
async function doUpdate() {
  const b = document.getElementById('b-upd'); b.disabled = true; b.textContent = '更新中…';
  try { const r = await post('/update-tools'); showToast((r.messages || []).join('；') || r.status, r.status === 'ok' ? 'ok' : 'err'); await api('/ping', { method: 'POST' }); }
  catch (e) { showToast(errMsg(e), 'err'); }
  b.textContent = '更新 yt-dlp'; loadStatus();
}
async function loadRuns() {
  try { S.runs = (await api('/runs?limit=12')).items || []; } catch (_) {}
  const label = { scan: '检测', download: '下载' };
  const stl = { ok: '完成', failed: '失败', running: '进行中', stopped: '已停止', interrupted: '中断' };
  document.getElementById('runs').innerHTML = S.runs.length ? S.runs.map(r => {
    const c = r.counts || {};
    const desc = r.kind === 'scan' ? `${c.sources ?? '-'} 个来源，新增 ${c.new ?? 0}${c.errors ? `，${c.errors} 个出错` : ''}`
                                   : `${c.done ?? 0}/${c.total ?? '-'} 完成${c.failed ? `，失败 ${c.failed}` : ''}`;
    return `<div class="r"><span class="k">${label[r.kind] || r.kind}</span><span class="s st-${r.status}">${stl[r.status] || r.status}</span>
      <span class="c">${desc}${r.error ? ` · <span class="err">${esc(r.error)}</span>` : ''}${r.trigger === 'auto' ? ' · 自动' : ''}</span>
      <span class="muted small">${ago(r.started_at)}</span></div>`;
  }).join('') : '<div class="empty">还没有运行记录</div>';
}

function loadAll(force) {
  if (force) api('/ping', { method: 'POST' }).then(loadStatus).catch(() => loadStatus()); else loadStatus();
  loadSources(); loadItems(); loadRuns();
}
mountTokenBar();
loadAll();
</script>
</body>
