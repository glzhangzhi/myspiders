name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 少数测试（菜谱 / 账单的 repo 字段保护、启动入口）会真连 MongoDB；用一个一次性的空库
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DEFAULT_DB: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt
      - name: Privacy scan
        run: python scripts/check_public.py
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm 版本由 web/package.json 的 packageManager 字段决定（corepack 按它下载）
      - run: npm install -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
